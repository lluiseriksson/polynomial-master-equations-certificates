[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polynomial-master-equations-certificates"
version = "1.0.0"
description = "Machine-checked Lean 4.35.0 proofs and exact-Q certificate verifier POLY-MASTER-CERT-1.0 for Ishizaki & Lee (arXiv:2611.33027)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Lluis Eriksson"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8"]
